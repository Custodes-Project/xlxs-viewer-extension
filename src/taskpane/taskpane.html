<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSDC Excel Viewer</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="task-pane">
    <!-- Section 1: Configuration -->
    <section id="section-1" class="section-content">
        <div class="control-group">
            <button class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">Select configuration file</span>
            </button>
            <div class="file-info-container">
                <div id="file-name-display" class="filename-outline">
                    No file selected
                </div>
            </div>
        </div>
    </section>

    <!-- Section 2: Accounts -->
    <section id="section-2" class="section-content">
        <div class="control-group">
            <button class="ms-Button ms-Button--standard">
                <span class="ms-Button-label">Configure accounts</span>
            </button>
        </div>
    </section>

    <!-- Section 3: Data Selection -->
    <section id="section-3" class="section-content">
        <div class="control-group">
            <button class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">Select file</span>
            </button>
            <div class="file-info-container">
                <div id="data-file-name-display" class="filename-outline">
                    No file selected
                </div>
            </div>
        </div>
    </section>

    <!-- Section 4: Spacer -->
    <section id="section-4" class="section-spacer"></section>

    <!-- Section 5: Execution -->
    <section id="section-5" class="section-content section-bottom">
        <div class="control-group">
            <button id="main-action-button" class="ms-Button ms-Button--primary full-width">
                <span class="ms-Button-label">Select config and input file first</span>
            </button>
        </div>
    </section>
</div>
</body>

</html>
